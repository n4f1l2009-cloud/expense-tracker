<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="tracker-app">

    <header class="tracker-header">
      <h1 class="tracker-header__title">Tracker<span class="tracker-header__dot">.io</span></h1>
      <p class="tracker-header__greeting">Halo, <strong>Muhammad Nafil Zamri(nafill)</strong></p>
    </header>

    <main>
      <section class="tracker-summary" aria-labelledby="summary-heading">
        <h2 id="summary-heading" class="visually-hidden">Ringkasan Keuangan</h2>

        <div class="tracker-summary__balance">
          <h3 class="tracker-summary__label">Saldo Saat Ini</h3>
          <p class="tracker-summary__balance-amount">Rp 0</p>
        </div>

        <div class="tracker-summary__stat tracker-summary__stat--income">
          <h3 class="tracker-summary__label">Pemasukan</h3>
          <p class="tracker-summary__stat-amount tracker-summary__stat-amount--income">Rp 0</p>
        </div>

        <div class="tracker-summary__stat tracker-summary__stat--expense">
          <h3 class="tracker-summary__label">Pengeluaran</h3>
          <p class="tracker-summary__stat-amount tracker-summary__stat-amount--expense">Rp 0</p>
        </div>
      </section>

      <section class="tracker-form-section" aria-labelledby="form-heading">
        <div class="tracker-form-section__card" id="formCard">
          <h2 id="form-heading" class="tracker-form-section__heading">Catat transaksi</h2>

          <form id="transactionForm" data-testid="transactionForm" class="tracker-form" novalidate>
            <div class="tracker-form__field tracker-form__field--title">
              <label class="tracker-form__label" for="transactionFormTitleInput">Keterangan</label>
              <input type="text" id="transactionFormTitleInput" data-testid="transactionFormTitleInput" class="tracker-form__input" placeholder="Misal: Makan siang" autocomplete="off">
            </div>
            <div class="tracker-form__field">
              <label class="tracker-form__label" for="transactionFormAmountInput">Nominal (Rp)</label>
              <input type="number" id="transactionFormAmountInput" data-testid="transactionFormAmountInput" class="tracker-form__input" placeholder="50000" inputmode="numeric" min="1">
            </div>
            <div class="tracker-form__field">
              <label class="tracker-form__label" for="transactionFormDateInput">Tanggal</label>
              <input type="date" id="transactionFormDateInput" data-testid="transactionFormDateInput" class="tracker-form__input">
            </div>
            <div class="tracker-form__field">
              <label class="tracker-form__label" for="transactionFormTypeSelect">Jenis</label>
              <select id="transactionFormTypeSelect" data-testid="transactionFormTypeSelect" class="tracker-form__input">
                <option value="income">Uang Masuk (+)</option>
                <option value="expense">Uang Keluar (-)</option>
              </select>
            </div>
            <div class="tracker-form__actions">
              <button type="submit" data-testid="transactionFormSubmitButton" class="tracker-form__submit">Simpan</button>
              <button type="button" id="cancelEditButton" class="tracker-form__cancel" hidden>Batal</button>
            </div>
            <p id="formError" class="tracker-form__error" role="alert" hidden></p>
          </form>
        </div>
      </section>

      <section class="tracker-history" aria-labelledby="history-heading">
        <h2 id="history-heading" class="visually-hidden">Riwayat Transaksi</h2>

        <div class="tracker-search">
          <form id="searchTransactionForm" data-testid="searchTransactionForm" class="tracker-search__form" role="search">
            <input type="search" id="searchTransactionFormTitleInput" data-testid="searchTransactionFormTitleInput" class="tracker-form__input" placeholder="Cari transaksi..." aria-label="Kata kunci pencarian transaksi">
            <button type="submit" data-testid="searchTransactionFormSubmitButton" class="tracker-search__submit" aria-label="Mulai Pencarian">Cari</button>
          </form>
        </div>

        <div class="tracker-history__grid">
          <div class="tracker-transaction-list tracker-transaction-list--income">
            <div class="tracker-transaction-list__header">
              <h3 class="tracker-transaction-list__title">Arus Pemasukan</h3>
            </div>
            <!-- Jangan ubah atau hapus atribut data-testid pada elemen berikut -->
            <div id="incomeList" data-testid="incomeList" class="tracker-transaction-list__container"></div>
          </div>

          <div class="tracker-transaction-list tracker-transaction-list--expense">
            <div class="tracker-transaction-list__header">
              <h3 class="tracker-transaction-list__title">Arus Pengeluaran</h3>
            </div>
            <!-- Jangan ubah atau hapus atribut data-testid pada elemen berikut -->
            <div id="expenseList" data-testid="expenseList" class="tracker-transaction-list__container"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="tracker-footer">
      <p>&#169; 2026 Tracker.io. Disusun sebagai Starter Project Submission Front-End Web.</p>
    </footer>

  </div>

  <script src="main.js"></script>
</body>
</html>
